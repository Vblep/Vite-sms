<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite SMS • Sign In or Create Account</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3b5bff;
            --success: #10b981;
            --danger: #ef4444;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-600: #475569;
            --gray-900: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            animation: floatIn 0.6s ease-out;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            padding: 48px 40px 32px;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .logo img {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .header p {
            opacity: 0.95;
            font-size: 17px;
        }

        /* Form Area */
        .form-area {
            padding: 40px;
            background: white;
        }

        .tabs {
            display: flex;
            margin-bottom: 32px;
            background: #f1f5f9;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
        }

        .tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            background: var(--primary);
            color: white;
            border-radius: 16px;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid var(--primary);
        }

        /* Form Fields */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gray-900);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid var(--gray-200);
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s;
            background: var(--gray-100);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 5px rgba(67, 97, 238, 0.15);
            transform: translateY(-2px);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(67, 97, 238, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        /* Messages */
        .message {
            margin: 20px 0;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
        }

        .error { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
        .success { background: #d1fae5; color: var(--success); border: 1px solid #a7f3d0; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--gray-600);
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .form-area { padding: 30px 24px; }
            .header { padding: 40px 24px 28px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="https://i.postimg.cc/P5KzmGCZ/freepik-assistant-39569.png" alt="Vite SMS">
                VITE SMS
            </div>
            <h1>Virtual Numbers, Instantly</h1>
            <p>Join thousands getting SMS online worldwide</p>
        </div>

        <!-- Form -->
        <div class="form-area">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Sign In</div>
                <div class="tab" onclick="switchTab('register')">Create Account</div>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <div id="loginMessage"></div>
                <button class="btn btn-primary" onclick="login()">Sign In to Dashboard</button>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Create Password</label>
                    <input type="password" id="regPassword" placeholder="Minimum 6 characters" required>
                </div>
                <div id="regMessage"></div>
                <button class="btn btn-primary" onclick="register()">Create Free Account</button>
            </div>
        </div>

        <div class="footer">
            Secured by Supabase • End-to-end encrypted
        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient(
            'https://qboynrkncsnwnbhsestw.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFib3lucmtuY3Nud25iaHNlc3R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MTg0NDEsImV4cCI6MjA3OTQ5NDQ0MX0.DMyHGbLMrG7DDkn9NAJdnB8BWzKiysQhwLIA-j9IlfQ'
        )

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
            event.target.classList.add('active')
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none'
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none'
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim()
            const password = document.getElementById('loginPassword').value

            if (!email || !password) return showMsg('loginMessage', 'Please fill all fields', 'error')

            const { error } = await supabase.auth.signInWithPassword({ email, password })
            if (error) {
                showMsg('loginMessage', error.message, 'error')
            } else {
                window.location.href = 'dashboard.html'
            }
        }

        async function register() {
            const name = document.getElementById('regName').value.trim()
            const email = document.getElementById('regEmail').value.trim()
            const password = document.getElementById('regPassword').value

            if (!name || !email || !password) return showMsg('regMessage', 'All fields are required', 'error')
            if (password.length < 6) return showMsg('regMessage', 'Password must be 6+ characters', 'error')

            const { data, error } = await supabase.auth.signUp({
                email, password,
                options: { data: { full_name: name } }
            })

            if (error) {
                showMsg('regMessage', error.message, 'error')
            } else {
                await supabase.from('profiles').insert({
                    id: data.user.id,
                    full_name: name,
                    email: email,
                    balance: 0
                })
                showMsg('regMessage', 'Account created! Redirecting...', 'success')
                setTimeout(() => window.location.href = 'dashboard.html', 1800)
            }
        }

        function showMsg(id, text, type) {
            document.getElementById(id).innerHTML = `<div class="message \( {type}"> \){text}</div>`
        }

        // Auto redirect if logged in
        supabase.auth.onAuthStateChange((_, session) => {
            if (session) window.location.href = 'dashboard.html'
        })

        // Enter key support
        document.addEventListener('keypress', e => e.key === 'Enter' && (document.getElementById('loginForm').style.display === 'block' ? login() : register()))
    </script>
</body>
</html>
